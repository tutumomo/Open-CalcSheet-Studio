name: Build and Release

# Twee manieren om een release te starten, allebei vanaf main:
#   - Run workflow, zonder invoer: het volgende nummer voor deze week. De workflow
#     zet het overal, commit dat op main en bouwt die commit.
#   - Een tag vJJJJ.W.N pushen: de bestanden op die commit moeten dat nummer al dragen
#     (node scripts/versie.mjs zet JJJJ.W.N), anders stopt de run voordat er iets
#     gebouwd wordt.
# De wijzigingen van de versie komen uit docs/CHANGELOG.md in de release-tekst; zonder
# wijzigingen stopt de run ook. Run workflow maakt van "Nog niet uitgebracht" de sectie
# van het nieuwe nummer, net als node scripts/versie.mjs zet.
# Bouwen, ondertekenen en controleren gaan eerst; pas als dat op elk platform groen
# is, ook op de bestanden van het concept, wordt de release openbaar.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versie JJJJ.W.N zonder v; leeg is het volgende nummer voor deze week'
        required: false
        default: ''

permissions:
  contents: read

# Twee releases tegelijk zouden hetzelfde volgnummer kunnen kiezen.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  voorbereiden:
    name: Nummer bepalen
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      versie: ${{ steps.nummer.outputs.versie }}
      tag: ${{ steps.nummer.outputs.tag }}
      sha: ${{ steps.nummer.outputs.sha }}
      wijzigingen: ${{ steps.nummer.outputs.wijzigingen }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      # Invoer en tagnaam zijn vrije tekst en gaan daarom via env, nooit via ${{ }}
      # in het script. versie.mjs laat alleen JJJJ.W.N door.
      - name: Bepaal en controleer het nummer
        id: nummer
        env:
          GH_TOKEN: ${{ github.token }}
          INVOER: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::Een release start vanaf main, niet vanaf $GITHUB_REF."
              exit 1
            fi
            VERSIE="${INVOER:-$(node scripts/versie.mjs volgende)}"
            if [ -n "$(git ls-remote --tags origin "refs/tags/v$VERSIE")" ]; then
              echo "::error::De tag v$VERSIE bestaat al."
              exit 1
            fi
            node scripts/versie.mjs zet "$VERSIE"
          else
            VERSIE="${GITHUB_REF_NAME#v}"
          fi
          node scripts/versie.mjs controleer "$VERSIE"
          WIJZIGINGEN="$(node scripts/wijzigingen.mjs tekst "$VERSIE")"

          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$VERSIE" --silent 2>/dev/null; then
            echo "::error::Release v$VERSIE bestaat al; die wordt niet vervangen."
            exit 1
          fi

          if [ -n "$(git status --porcelain)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit --all --message "Versie $VERSIE"
            git push origin HEAD:main
          fi

          EINDE="EINDE_$(openssl rand -hex 8)"
          {
            echo "versie=$VERSIE"
            echo "tag=v$VERSIE"
            echo "sha=$(git rev-parse 'HEAD^{commit}')"
            echo "wijzigingen<<$EINDE"
            printf '%s\n' "$WIJZIGINGEN"
            echo "$EINDE"
          } >> "$GITHUB_OUTPUT"
          echo "Release v$VERSIE vanaf $(git rev-parse --short HEAD)"

  bouwen:
    needs: voorbereiden
    uses: ./.github/workflows/desktop-ondertekend.yml
    with:
      ref: ${{ needs.voorbereiden.outputs.sha }}
      versie: ${{ needs.voorbereiden.outputs.versie }}
    secrets: inherit

  concept:
    needs: [voorbereiden, bouwen]
    permissions:
      contents: write
    uses: ./.github/workflows/release-concept.yml
    with:
      fem-studio: ${{ needs.bouwen.outputs.fem-studio-platformen }}
      tag: ${{ needs.voorbereiden.outputs.tag }}
      sha: ${{ needs.voorbereiden.outputs.sha }}
      versie: ${{ needs.voorbereiden.outputs.versie }}
      naam: Open CalcSheet Studio ${{ needs.voorbereiden.outputs.tag }}
      tekst: |
        ## What's New in ${{ needs.voorbereiden.outputs.tag }}

        Open desktop app for structural calculations written as calculation text, with direct IFC 4x3 / IFCX export.

        ${{ needs.voorbereiden.outputs.wijzigingen }}

        ${{ needs.bouwen.outputs.fem-studio-tekst }}

        ### Downloads
        - **Windows (System)**: Download the `*_x64-setup.exe` installer for system-wide installation (requires admin)
        - **Windows (User)**: Download the `*_x64_user-setup.exe` installer for current user only (no admin required)
        - **macOS**: Download the `.dmg` file (universal - supports Intel and Apple Silicon)
        - **Linux**: Download the `.deb` package or `.AppImage`

        ### Verification
        Windows installers carry an Authenticode signature with timestamp, the macOS app and `.dmg` a Developer ID signature with a notarization ticket. Linux packages and `SHA256SUMS.txt` have detached OpenPGP signatures (`.asc`); the public key is `openaec-release-key.asc`, fingerprint `13F6D414ADEE4ED4CD09AC60601D86C93C504D29`. How to verify: [docs/ondertekening.md](https://github.com/${{ github.repository }}/blob/main/docs/ondertekening.md).
    secrets: inherit

  controleren:
    needs: [voorbereiden, bouwen, concept]
    permissions:
      contents: write
    uses: ./.github/workflows/release-controleren.yml
    with:
      tag: ${{ needs.voorbereiden.outputs.tag }}
      sha: ${{ needs.voorbereiden.outputs.sha }}
      fem-studio: ${{ needs.bouwen.outputs.fem-studio-platformen }}
    secrets: inherit

  publiceren:
    name: Publiceren
    needs: [voorbereiden, concept, controleren]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publiceer de release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.concept.outputs.release_id }}
        run: |
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false -F prerelease=false -f make_latest=true \
            --jq '"Gepubliceerd: " + .html_url'

  # De werkelijk aangeboden downloads nog een keer. Dit kan niets meer tegenhouden,
  # maar een rode run hier betekent dat er iets mis is met wat openbaar staat.
  na-publicatie:
    needs: [voorbereiden, bouwen, publiceren]
    permissions:
      contents: write
    uses: ./.github/workflows/release-controleren.yml
    with:
      tag: ${{ needs.voorbereiden.outputs.tag }}
      sha: ${{ needs.voorbereiden.outputs.sha }}
      fem-studio: ${{ needs.bouwen.outputs.fem-studio-platformen }}
    secrets: inherit
