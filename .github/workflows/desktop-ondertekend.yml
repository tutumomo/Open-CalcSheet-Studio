name: Desktop ondertekend

# Bouwt, ondertekent en controleert de installers, en bewaart ze als artifacts bij
# de run. Publiceert zelf niets. Build.yml, nightly.yml en release.yml roepen dit aan
# met `secrets: inherit`, zodat er één weg is en een release niet anders ontstaat
# dan een proefbouw. Een ontbrekend geheim, een mislukte handtekening of een
# gezakte controle laat de job falen; er komt dan geen artifact.
#
# De geheimen staan per stap, niet per job: alleen de stappen die ze nodig hebben
# krijgen ze te zien.
#
# De server van Open FEM Studio (fem-studio/versie.json) gaat mee als resource, met
# de handtekening van FEM Studio: Tauri tekent een resource niet, en de notarisatie
# op macOS eist dat elk programma in de app een Developer ID-handtekening heeft. De
# stap "FEM Studio ophalen" haalt hem uit de openbare release fem-server-<versie> van
# deze repository; een geheim is daar niet voor nodig. Zonder bestand voor het
# platform in versie.json bouwt de app zonder server: een waarschuwing in de log, en
# de uitvoer fem-studio-tekst zegt het in de release-tekst. Is hij opgehaald, dan
# controleert de job zijn handtekening vóór het bouwen en zoekt de controle hem
# daarna in de installer, met de licentie, de vermeldingen van derden en de
# verwijzing naar de bron ernaast.
#
# De server valt onder de AGPL-3.0. Gaat hij op een platform mee, dan zet de job
# fem-studio het bronarchief van precies die versie bij de artifacts; een release
# zet het zo naast de installers (scripts/release/assets-klaarzetten.sh eist het).

on:
  workflow_call:
    outputs:
      fem-studio-platformen:
        description: 'De platformen met de server van FEM Studio, zoals "windows-x64 macos-universal linux-x64"'
        value: ${{ jobs.fem-studio.outputs.platformen }}
      fem-studio-tekst:
        description: 'Of de server van FEM Studio is meegeleverd, voor de release-tekst'
        value: ${{ jobs.fem-studio.outputs.tekst }}
    inputs:
      ref:
        description: 'De commit om te bouwen; leeg is de commit van de run'
        type: string
        default: ''
      versie:
        description: 'Het nummer dat in de bestanden moet staan; leeg is alleen onderling gelijk'
        type: string
        default: ''
      rust-cache:
        description: 'Rust-cache gebruiken; niet voor een release, die bouwt uit een schone map'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    name: Desktop (windows-${{ matrix.variant }})
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      fem-studio: ${{ steps.fem.outputs.status }}
      fem-studio-versie: ${{ steps.fem.outputs.versie }}
    strategy:
      fail-fast: false
      matrix:
        variant: ['system', 'user']

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        if: inputs.rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri
          key: windows-${{ matrix.variant }}

      - name: Controleer het versienummer
        shell: pwsh
        env:
          VERSIE: ${{ inputs.versie }}
        run: |
          if ($env:VERSIE) { node scripts/versie.mjs controleer $env:VERSIE } else { node scripts/versie.mjs controleer }
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Install workspace dependencies
        run: npm ci

      - name: Build core package
        run: npm run build --workspace=@ifc-calc/core

      # De server van Open FEM Studio voor de normtoetsingen (fem-studio/versie.json),
      # uit de openbare release fem-server-<versie>, met de vermeldingen van derden.
      # Zonder bestand voor dit platform bouwt de app zonder; Instellingen > Over meldt
      # dan "niet meegeleverd".
      - name: FEM Studio ophalen
        id: fem
        run: node scripts/haal-fem-server.mjs

      # Authenticode van FEM Studio, met de eigen uitgever en een tijdstempel. Tauri
      # tekent de resource niet opnieuw; zo blijft ook de sha256 die van versie.json.
      - name: Controleer de handtekening van de FEM-server
        if: steps.fem.outputs.status == 'meegeleverd'
        shell: pwsh
        run: pwsh -NoProfile -File scripts/release/windows-controleren.ps1 -Bestand packages/desktop/src-tauri/fem-studio/openaec-mcp-server.exe

      # De signeerclient van Azure heeft .NET 8 nodig.
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Prepare Authenticode signing
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          VARIANT: ${{ matrix.variant }}
        run: pwsh -NoProfile -File scripts/release/windows-ondertekenen.ps1 -Voorbereiden -Variant $env:VARIANT

      # Tauri roept het ondertekenscript aan voor het programma, de uninstaller
      # (tijdens het bundelen) en daarna de installer.
      - name: Build and sign Tauri app
        shell: pwsh
        working-directory: packages/desktop
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          npm run tauri -- build --config "$env:CALC_SIGN_CONFIG"
          if ($LASTEXITCODE -ne 0) { throw "tauri build faalde (exit $LASTEXITCODE)" }

      # Hernoemen breekt een Authenticode-handtekening niet.
      - name: Rename user installer
        if: matrix.variant == 'user'
        shell: pwsh
        working-directory: packages/desktop/src-tauri/target/release/bundle/nsis
        run: |
          Get-ChildItem *_x64-setup.exe |
            Rename-Item -NewName { $_.Name -replace '_x64-setup\.exe$', '_x64_user-setup.exe' }

      - name: Controleer de handtekeningen
        shell: pwsh
        env:
          FEM_STUDIO_VEREIST: ${{ steps.fem.outputs.status == 'meegeleverd' }}
        run: pwsh -NoProfile -File scripts/release/windows-controleren.ps1 -Map packages/desktop/src-tauri/target/release/bundle/nsis -Aantal 1

      - name: Upload installer
        uses: actions/upload-artifact@v5
        with:
          name: open-calcsheet-studio-windows-${{ matrix.variant }}
          path: packages/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  macos:
    name: Desktop (macos)
    runs-on: macos-latest
    timeout-minutes: 60
    outputs:
      fem-studio: ${{ steps.fem.outputs.status }}
      fem-studio-versie: ${{ steps.fem.outputs.versie }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust targets (universal)
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust build
        if: inputs.rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri
          key: macos

      - name: Controleer het versienummer
        env:
          VERSIE: ${{ inputs.versie }}
        run: node scripts/versie.mjs controleer $VERSIE

      - name: Install workspace dependencies
        run: npm ci

      - name: Build core package
        run: npm run build --workspace=@ifc-calc/core

      # De server van Open FEM Studio voor de normtoetsingen (fem-studio/versie.json),
      # uit de openbare release fem-server-<versie>, met de vermeldingen van derden.
      # Zonder bestand voor dit platform bouwt de app zonder; Instellingen > Over meldt
      # dan "niet meegeleverd".
      - name: FEM Studio ophalen
        id: fem
        run: node scripts/haal-fem-server.mjs

      # Tauri tekent een resource niet, maar de notarisatie eist een Developer
      # ID-handtekening met hardened runtime en tijdstempel op elk programma in de
      # app. FEM Studio levert de server zo aan; hier de controle, vóór het bouwen.
      - name: Controleer de handtekening van de FEM-server
        if: steps.fem.outputs.status == 'meegeleverd'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/release/macos-controleren.sh --fem-server packages/desktop/src-tauri/fem-studio/openaec-mcp-server

      - name: Controleer de geheimen en schrijf de notarisatiesleutel
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          set -euo pipefail
          for naam in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_TEAM_ID \
                      APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_CONTENT; do
            test -n "${!naam:-}" || { echo "::error::geheim $naam ontbreekt"; exit 1; }
          done
          umask 077
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/apple-api-key.p8"

      # Tauri importeert het certificaat in een tijdelijke sleutelhanger, ondertekent
      # de app met Developer ID en notariseert en staplet hem.
      - name: Build, sign and notarize Tauri app
        working-directory: packages/desktop
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/apple-api-key.p8
        run: npm run tauri -- build --target universal-apple-darwin

      - name: Notarize and staple dmg
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/apple-api-key.p8
        run: bash scripts/release/macos-notariseren.sh packages/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg

      - name: Verwijder de notarisatiesleutel
        if: always()
        run: rm -f "$RUNNER_TEMP/apple-api-key.p8"

      - name: Controleer de handtekeningen
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          FEM_STUDIO_VEREIST: ${{ steps.fem.outputs.status == 'meegeleverd' }}
        run: bash scripts/release/macos-controleren.sh packages/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg

      - name: Upload dmg
        uses: actions/upload-artifact@v5
        with:
          name: open-calcsheet-studio-macos
          path: packages/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  linux:
    name: Desktop (linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    outputs:
      fem-studio: ${{ steps.fem.outputs.status }}
      fem-studio-versie: ${{ steps.fem.outputs.versie }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        if: inputs.rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri
          key: linux

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Controleer het versienummer
        env:
          VERSIE: ${{ inputs.versie }}
        run: node scripts/versie.mjs controleer $VERSIE

      - name: Install workspace dependencies
        run: npm ci

      - name: Build core package
        run: npm run build --workspace=@ifc-calc/core

      # De server van Open FEM Studio voor de normtoetsingen (fem-studio/versie.json),
      # uit de openbare release fem-server-<versie>, met de vermeldingen van derden.
      # Zonder bestand voor dit platform bouwt de app zonder; Instellingen > Over meldt
      # dan "niet meegeleverd".
      - name: FEM Studio ophalen
        id: fem
        run: node scripts/haal-fem-server.mjs

      - name: Build Tauri app
        working-directory: packages/desktop
        run: npm run tauri -- build

      - name: Verzamel de pakketten
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/linux-pakketten"
          cp packages/desktop/src-tauri/target/release/bundle/deb/*.deb \
             packages/desktop/src-tauri/target/release/bundle/appimage/*.AppImage \
             "$RUNNER_TEMP/linux-pakketten/"

      - name: Sign packages
        env:
          OPENAEC_GPG_PRIVATE_KEY: ${{ secrets.OPENAEC_GPG_PRIVATE_KEY }}
          OPENAEC_GPG_PASSPHRASE: ${{ secrets.OPENAEC_GPG_PASSPHRASE }}
          OPENAEC_GPG_FINGERPRINT: ${{ vars.OPENAEC_GPG_FINGERPRINT }}
        run: bash scripts/release/linux-ondertekenen.sh "$RUNNER_TEMP/linux-pakketten"

      # Ook de FEM-server in de .deb (met de sha256 uit versie.json) en de .AppImage.
      - name: Controleer de handtekeningen
        env:
          FEM_STUDIO_VEREIST: ${{ steps.fem.outputs.status == 'meegeleverd' }}
        run: bash scripts/release/linux-controleren.sh "$RUNNER_TEMP/linux-pakketten"

      - name: Upload packages
        uses: actions/upload-artifact@v5
        with:
          name: open-calcsheet-studio-linux
          path: ${{ runner.temp }}/linux-pakketten/*
          if-no-files-found: error

  # Of de server van FEM Studio per platform is meegeleverd, voor de release-tekst en
  # de controles na het uploaden. Een opsomming zou de website als wijziging tellen;
  # daarom lopende tekst.
  fem-studio:
    name: FEM Studio meegeleverd?
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    outputs:
      platformen: ${{ steps.samenvatten.outputs.platformen }}
      tekst: ${{ steps.samenvatten.outputs.tekst }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      # Zonder bron geen binary: gaat de server op een platform mee, dan hoort het
      # bronarchief van precies die versie bij de installers.
      - name: Bronarchief van de FEM-server ophalen
        id: bron
        if: >-
          needs.windows.outputs.fem-studio == 'meegeleverd' ||
          needs.macos.outputs.fem-studio == 'meegeleverd' ||
          needs.linux.outputs.fem-studio == 'meegeleverd'
        run: |
          set -euo pipefail
          node scripts/haal-fem-server.mjs --bron "$RUNNER_TEMP/fem-bron"
          echo "naam=$(basename "$RUNNER_TEMP"/fem-bron/*_source.tar.gz)" >>"$GITHUB_OUTPUT"

      - name: Upload het bronarchief
        if: steps.bron.outputs.naam != ''
        uses: actions/upload-artifact@v5
        with:
          name: open-calcsheet-studio-fem-bron
          path: ${{ runner.temp }}/fem-bron/*_source.tar.gz
          if-no-files-found: error

      - name: Samenvatten
        id: samenvatten
        env:
          WINDOWS: ${{ needs.windows.outputs.fem-studio }}
          MACOS: ${{ needs.macos.outputs.fem-studio }}
          LINUX: ${{ needs.linux.outputs.fem-studio }}
          VERSIE: ${{ needs.linux.outputs.fem-studio-versie }}
          BRON: ${{ steps.bron.outputs.naam }}
        run: |
          set -euo pipefail
          MET=()
          MET_NAMEN=()
          ZONDER_NAMEN=()
          for regel in "windows-x64 Windows ${WINDOWS:-}" "macos-universal macOS ${MACOS:-}" "linux-x64 Linux ${LINUX:-}"; do
            read -r platform naam status <<<"$regel"
            if [ "${status:-}" = meegeleverd ]; then
              MET+=("$platform")
              MET_NAMEN+=("$naam")
            else
              ZONDER_NAMEN+=("$naam")
            fi
          done
          # "Windows, macOS and Linux"
          lijst() {
            local uit="" i=0
            for x in "$@"; do
              i=$((i + 1))
              if [ "$i" -eq 1 ]; then uit="$x"; elif [ "$i" -eq "$#" ]; then uit="$uit and $x"; else uit="$uit, $x"; fi
            done
            printf '%s' "$uit"
          }
          KOP="### Open FEM Studio"
          OVER='Settings › About shows "not included in this version".'
          if [ "${#MET[@]}" -gt 0 ]; then
            TEKST="$KOP"$'\n\n'"The headless server of Open FEM Studio ${VERSIE:-} (\`openaec-mcp-server\`) is included on $(lijst "${MET_NAMEN[@]}"), for the code checks in \`@toets\` blocks. It carries the signature of the Open FEM Studio release."
            TEKST+=$'\n\n'"The server is a separate program with its own license, the GNU AGPL-3.0 (Open CalcSheet Studio itself is LGPL-3.0). Its license, the third-party notices and a pointer to the source are installed next to it (see Settings › About). The complete source of exactly this server version is attached to this release: \`${BRON}\`."
            if [ "${#ZONDER_NAMEN[@]}" -gt 0 ]; then
              TEKST+=$'\n\n'"> **Not included on $(lijst "${ZONDER_NAMEN[@]}").** There the code checks in \`@toets\` blocks are not available. $OVER"
            fi
          else
            TEKST="$KOP"$'\n\n'"> **Not included.** This build does not include the server of Open FEM Studio, so the code checks in \`@toets\` blocks are not available. $OVER"
          fi
          if [ "${#ZONDER_NAMEN[@]}" -gt 0 ]; then
            echo "::warning::FEM Studio is niet meegeleverd op: $(lijst "${ZONDER_NAMEN[@]}")"
          fi
          EINDE="EINDE_$(openssl rand -hex 8)"
          {
            echo "platformen=${MET[*]}"
            echo "tekst<<$EINDE"
            printf '%s\n' "$TEKST"
            echo "$EINDE"
          } >>"$GITHUB_OUTPUT"
          printf '%s\n' "$TEKST" >>"$GITHUB_STEP_SUMMARY"
