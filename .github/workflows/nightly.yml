name: Nightly Build

# Daily / on-demand builds, published as a rolling pre-release on GitHub.
#
# Difference vs release.yml:
#   - release.yml  -> triggered by `v*` semver tags, becomes the "Latest" stable release
#   - nightly.yml  -> continuous interim builds, marked prerelease, single rolling tag
#
# De volgorde is bewust: eerst bouwen, ondertekenen en controleren, en pas als dat
# allemaal groen is de vorige nightly vervangen. Mislukt er iets, dan blijft de vorige
# staan en gaat er niets ongetekends naar buiten. Tot aan het publiceren heet het
# concept nightly-<run>, omdat de tag nightly dan nog bij de vorige hoort.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: read

concurrency:
  group: nightly-build
  cancel-in-progress: true

jobs:
  voorbereiden:
    name: Voorbereiden
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      versie: ${{ steps.nummer.outputs.versie }}
      bouwnummer: ${{ steps.nummer.outputs.bouwnummer }}
      sha: ${{ steps.nummer.outputs.sha }}
    steps:
      - uses: actions/checkout@v6

      - name: Compute nightly version
        id: nummer
        run: |
          set -euo pipefail
          node scripts/versie.mjs controleer
          VERSIE="$(node -p "require('./packages/desktop/package.json').version")"
          BOUWNUMMER="${VERSIE}-nightly.$(date -u +'%Y%m%d').$(git rev-parse --short HEAD)"
          {
            echo "versie=$VERSIE"
            echo "bouwnummer=$BOUWNUMMER"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
          echo "Building nightly $BOUWNUMMER"

      # Een afgebroken of mislukte run laat een concept achter. Alleen concepten van
      # deze workflow gaan weg; de gepubliceerde nightly blijft staan.
      - name: Ruim oude concepten op
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq '.[] | select(.draft and (.tag_name | startswith("nightly-"))) | .id' |
            while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"; done

  bouwen:
    needs: voorbereiden
    uses: ./.github/workflows/desktop-ondertekend.yml
    with:
      ref: ${{ needs.voorbereiden.outputs.sha }}
      versie: ${{ needs.voorbereiden.outputs.versie }}
    secrets: inherit

  concept:
    needs: [voorbereiden, bouwen]
    permissions:
      contents: write
    uses: ./.github/workflows/release-concept.yml
    with:
      fem-studio: ${{ needs.bouwen.outputs.fem-studio-platformen }}
      tag: nightly-${{ github.run_id }}
      sha: ${{ needs.voorbereiden.outputs.sha }}
      versie: ${{ needs.voorbereiden.outputs.versie }}
      naam: Nightly build ${{ needs.voorbereiden.outputs.bouwnummer }}
      prerelease: true
      tekst: |
        **Nightly / interim build** — not a stable release.

        Built from the latest `main` branch. May contain bugs or incomplete features.
        For stable, use the latest `v*` release.

        Source: `${{ needs.voorbereiden.outputs.sha }}`
        Build version: `${{ needs.voorbereiden.outputs.bouwnummer }}`

        ${{ needs.bouwen.outputs.fem-studio-tekst }}

        Windows and macOS installers are signed. Linux packages and `SHA256SUMS.txt` have detached
        OpenPGP signatures (`.asc`), key fingerprint `13F6D414ADEE4ED4CD09AC60601D86C93C504D29`.
        How to verify: [docs/ondertekening.md](https://github.com/${{ github.repository }}/blob/main/docs/ondertekening.md).
    secrets: inherit

  controleren:
    needs: [voorbereiden, bouwen, concept]
    permissions:
      contents: write
    uses: ./.github/workflows/release-controleren.yml
    with:
      tag: nightly-${{ github.run_id }}
      sha: ${{ needs.voorbereiden.outputs.sha }}
      fem-studio: ${{ needs.bouwen.outputs.fem-studio-platformen }}
    secrets: inherit

  publiceren:
    name: Publiceren
    needs: [voorbereiden, concept, controleren]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Vervang de vorige nightly
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.concept.outputs.release_id }}
          SHA: ${{ needs.voorbereiden.outputs.sha }}
        run: |
          set -euo pipefail
          gh release delete nightly --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -f tag_name=nightly -f target_commitish="$SHA" -F draft=false -F prerelease=true \
            --jq '"Gepubliceerd: " + .html_url'
