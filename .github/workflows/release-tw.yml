name: Release (Taiwan Edition / 台灣版發佈)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '發佈標籤（例如 v2026.45.2-tw.1）'
        required: true
        type: string
      draft:
        description: '先建立為草稿（Draft Release，建議開啟）'
        required: false
        default: true
        type: boolean

concurrency:
  group: release-tw-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: 驗證台灣版預設配置與全數檢查（91 checks）
    runs-on: ubuntu-latest
    steps:
      - name: 驗證觸發分支僅限 main
        env:
          TRIGGER_REF: ${{ github.ref }}
        run: |
          if [ "$TRIGGER_REF" != "refs/heads/main" ]; then
            echo "::error::Release workflow must be triggered from refs/heads/main (got $TRIGGER_REF)"
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: 檢核預設語言為繁體中文（STANDAARD_TAAL = zh-TW）
        run: |
          node -e '
            const fs = require("node:fs");
            const cfg = fs.readFileSync("packages/desktop/src/i18n/config.ts", "utf8");
            if (!cfg.includes("export const STANDAARD_TAAL = \"zh-TW\"")) {
              console.error("STANDAARD_TAAL is not zh-TW!");
              process.exit(1);
            }
            console.log("OK: STANDAARD_TAAL = zh-TW");
          '

      - name: Install workspace dependencies
        run: npm ci

      - name: Run all checks
        run: npm run check

      - name: Run Taiwan infrastructure validation
        run: node scripts/valideer-tw-basis.mjs

  build-bundle:
    name: 打包安裝檔 (${{ matrix.platform }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            artifact: 'calcsheet-tw-windows'
            bundle_glob: 'packages/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe'
          - platform: 'macos-latest'
            artifact: 'calcsheet-tw-macos'
            bundle_glob: 'packages/desktop/src-tauri/target/release/bundle/dmg/*.dmg'
          - platform: 'ubuntu-22.04'
            artifact: 'calcsheet-tw-linux'
            bundle_glob: 'packages/desktop/src-tauri/target/release/bundle/deb/*.deb'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Install system dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install workspace dependencies
        run: npm ci

      - name: Build core package
        run: npm run build --workspace=@ifc-calc/core

      - name: Build Tauri installer bundle
        working-directory: packages/desktop
        run: npm run tauri build

      - name: Upload installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bundle_glob }}
          if-no-files-found: error

  publish-release:
    name: 建立台灣版 GitHub Release 與校驗檔
    needs: build-bundle
    runs-on: ubuntu-latest
    environment: release-tw
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Download all installer artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist-assets
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: dist-assets
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          IS_DRAFT: ${{ inputs.draft }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z._-]+)?$ ]]; then
            echo "::error::Invalid tag format: $TAG"
            exit 1
          fi

          # 檢查遠端 tag 是否已存在，防止覆蓋既有標籤（區分 exit code 2: not found、0: exists、其他: error）
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1
          LS_EXIT=$?
          set -e
          case $LS_EXIT in
            2) echo "OK: tag $TAG does not exist on origin" ;;
            0) echo "::error::Tag $TAG already exists on remote origin!" ; exit 1 ;;
            *) echo "::error::Failed to query remote tags from origin (exit code $LS_EXIT)" ; exit 1 ;;
          esac

          # 檢查 GitHub Release 是否已存在
          set +e
          gh api -H "Accept: application/vnd.github+json" "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" >/dev/null 2>&1
          REL_EXIT=$?
          set -e
          if [ $REL_EXIT -eq 0 ]; then
            echo "::error::Release $TAG already exists on GitHub!"
            exit 1
          fi

          DRAFT_FLAG=""
          if [ "$IS_DRAFT" = "true" ]; then
            DRAFT_FLAG="--draft"
          fi

          RELEASE_NOTES="## Open CalcSheet Studio 台灣版 $TAG

- **來源 Commit**：\`$TARGET_SHA\`（由 main 分支經 91 項自動化測試通過後建置）
- **功能摘要**：預設繁體中文（zh-TW）介面、台灣 MKS 單位制（tf, kgf/cm²）與 15 組本土結構／大地／水保／載重計算模組。
- **發佈性質**：本產物為社群預覽測試版本（無商業 Authenticode / Apple Developer 數位簽名）。隨附 SHA256SUMS.txt 僅供核對檔案下載傳輸完整性，不提供代碼簽名擔保。正式生產環境請於信任主機自行編譯或等待官方簽名版本。"

          gh release create "$TAG" dist-assets/* \
            --target "$TARGET_SHA" \
            --title "Open CalcSheet Studio 台灣版 $TAG" \
            --notes "$RELEASE_NOTES" \
            $DRAFT_FLAG

          # 發佈後校驗：確認遠端 tag 指向目標 commit
          git fetch origin "refs/tags/$TAG"
          CREATED_SHA=$(git rev-parse "refs/tags/$TAG^{commit}")
          if [ "$CREATED_SHA" != "$TARGET_SHA" ]; then
            echo "::error::Tag provenance verification failed! Created tag points to $CREATED_SHA, expected $TARGET_SHA"
            exit 1
          fi
          echo "OK: Tag $TAG provenance verified (points to $TARGET_SHA)"
