[package]
name = "open-calcsheet-studio"
version = "2026.46.2"
description = "Open CalcSheet Studio - lightweight calculation text app for Eurocode verifications"
authors = ["OpenAEC Contributors"]
edition = "2021"

[lib]
name = "open_calcsheet_studio_lib"
crate-type = ["staticlib", "rlib"]

[features]
default = []
# Bouwt de PDF-commando's mee die de OpenAEC-rapportengine gebruiken. Zonder
# deze vlag print de app via de browser (zie components/calc/PrintDocument.tsx)
# en geven de engine-commando's een nette foutmelding.
rapportengine = ["dep:openaec-core"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# build.rs leest `identifier` uit tauri.conf.json om de editie (`tw` of
# `upstream`) te bepalen; zie de toelichting boven in build.rs.
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-store = "2.4.2"
tauri-plugin-os = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# MCP-brug (src/mcp_bridge.rs): een klein HTTP-doorgeefluik op 127.0.0.1 voor
# een AI-assistent. Pure Rust, zonder TLS (alleen loopback).
tiny_http = "0.12"
# ERPNext (src/erpnext.rs): het verzoek gaat via Rust, vanwege CORS. ureq met rustls
# (ring), zonder OpenSSL of native-tls, zodat het op elk platform zonder extra
# systeempakket bouwt. `native-certs`: de certificaten van het besturingssysteem, zodat
# een ERPNext met een eigen (bedrijfs-)CA ook werkt. `url` staat al in de boom (tauri,
# ureq) en toetst het adres.
ureq = { version = "2", default-features = false, features = ["tls", "json", "native-certs"] }
url = "2"
# Het API-geheim staat in de sleutelbos van het besturingssysteem. Zonder deze
# platformvlaggen valt keyring 3 terug op een nep-opslag die niets bewaart. Op Linux
# gebruikt de Secret Service libdbus; die bouwt tao al (zelfde systeempakket).
# `crypto-rust` versleutelt de sessie met de Secret Service, in pure Rust.
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native-sync-persistent", "crypto-rust"] }
# Het geheim en de header met het geheim worden na gebruik gewist.
zeroize = "1"
# OAuth 2.0 PKCE (src/ai.rs): code_verifier/state en S256-challenge. Alle drie staan al in Cargo.lock.
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
# Open FEM Studio headless (src/fem_studio.rs): het proces en het protocol, in een eigen
# crate zonder Tauri, zodat de tests ook op Windows draaien (fem-brug/src/lib.rs).
ocss-fem-brug = { path = "fem-brug" }

# OpenAEC-rapportengine — optioneel, standaard uit.
#
# Stond hier eerder als pad naar een zusterrepo (`../../../../openaec-reports`).
# Dat pad bestaat alleen op de machine waar die repo toevallig naast dit
# project staat; overal elders faalde `cargo build` — en daarmee de hele
# desktop-app, niet alleen de PDF. Nu wijst hij naar de publieke repo en is hij
# bovendien optioneel, zodat dit project op zichzelf bouwt: zonder zusterrepo,
# zonder netwerk.
#
# Aanzetten met:  cargo build --features rapportengine
#                 npm run tauri build -- --features rapportengine
openaec-core = { git = "https://github.com/OpenAEC-Foundation/openaec-reports", branch = "main", optional = true }

# Het rapport als PDF zonder printdialoog (src/rapport_pdf.rs). Dezelfde versies als
# in de `tauri`-afhankelijkheid: de webview die Tauri aanreikt, is van dit type.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = "0.61"

# Release profile — reduce LTO + raise codegen-units so the linker fits in RAM
# on dev machines (LLVM OOM otherwise). Trade-off: slightly bigger binary.
[profile.release]
lto = "thin"
codegen-units = 16
strip = "debuginfo"
